name: GUIROPA Home Commercial + Live Agenda Validation

on:
  pull_request:
    paths:
      - "client/src/components/Layout.jsx"
      - "client/src/components/HomeLiveAgenda.jsx"
      - "client/src/data/liveAgenda.js"
      - "client/src/pages/HomePage.jsx"
      - "client/src/pages/ShowsPage.jsx"
      - "client/src/styles/header-logo-fix.css"
      - ".github/workflows/guiropa-home-commercial-agenda-validation.yml"
  push:
    branches: [main]
    paths:
      - "client/src/components/Layout.jsx"
      - "client/src/components/HomeLiveAgenda.jsx"
      - "client/src/data/liveAgenda.js"
      - "client/src/pages/HomePage.jsx"
      - "client/src/pages/ShowsPage.jsx"
      - "client/src/styles/header-logo-fix.css"
      - ".github/workflows/guiropa-home-commercial-agenda-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Build GUIROPA
        run: npm run build
        working-directory: client
      - name: Verify calm commercial layout, long-range agenda and protected tunnels
        shell: bash
        run: |
          grep -q 'GuiropaCommercialFooterDeck' client/src/components/Layout.jsx
          ! grep -q 'GuiropaCommercialLayer' client/src/components/Layout.jsx
          ! grep -q 'GuiropaCommercialCascade' client/src/components/Layout.jsx
          ! grep -q 'GuiropaCommercialInterstitial' client/src/components/Layout.jsx
          ! grep -q 'GuiropaCommercialFloat' client/src/components/Layout.jsx
          grep -q 'guiropa-radio-anuncie-vintage-15-dias.png' client/src/pages/HomePage.jsx
          grep -q 'object-fit:contain' client/src/pages/HomePage.jsx
          grep -q 'HomeLiveAgenda' client/src/pages/HomePage.jsx
          grep -q 'slice(0, 5)' client/src/components/HomeLiveAgenda.jsx
          grep -q 'to="/shows"' client/src/components/HomeLiveAgenda.jsx
          grep -q '2027-03-06' client/src/data/liveAgenda.js
          grep -q 'Iron Maiden' client/src/data/liveAgenda.js
          grep -q 'Os Paralamas do Sucesso' client/src/data/liveAgenda.js
          grep -q 'Scorpions' client/src/data/liveAgenda.js
          grep -q 'Duran Duran' client/src/data/liveAgenda.js
          grep -q 'Deep Purple' client/src/data/liveAgenda.js
          grep -q 'guiropa-logo-plaque--header' client/src/styles/header-logo-fix.css
          test -f client/src/pages/Guiropa70sTunnelPage.jsx
          test -f client/src/pages/Guiropa80sTunnelPage.jsx
          grep -q '181-70s_128k.mp3' client/src/pages/GuiropaUnifiedRadioPage.jsx
          grep -q '181-awesome80s_128k.mp3' client/src/pages/GuiropaUnifiedRadioPage.jsx
