name: GUIROPA Home Commercial + Live Agenda Validation

on:
  pull_request:
    paths:
      - "client/src/components/Layout.jsx"
      - "client/src/components/GuiropaCommercialLayer.jsx"
      - "client/src/components/ExploreHub.jsx"
      - "client/src/components/HomeLiveAgenda.jsx"
      - "client/src/styles/header-logo-fix.css"
      - ".github/workflows/guiropa-home-commercial-agenda-validation.yml"
  push:
    branches: [main]
    paths:
      - "client/src/components/Layout.jsx"
      - "client/src/components/GuiropaCommercialLayer.jsx"
      - "client/src/components/ExploreHub.jsx"
      - "client/src/components/HomeLiveAgenda.jsx"
      - "client/src/styles/header-logo-fix.css"
      - ".github/workflows/guiropa-home-commercial-agenda-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Build GUIROPA
        run: npm run build
        working-directory: client
      - name: Verify commercial separation, logo and long-range live agenda
        shell: bash
        run: |
          grep -q 'guiropa-commercial-top-zone' client/src/components/Layout.jsx
          grep -q '<GuiropaCommercialCascade />' client/src/components/Layout.jsx
          grep -q 'padding-top:var(--header-h)' client/src/components/GuiropaCommercialLayer.jsx
          grep -q 'HomeLiveAgenda' client/src/components/ExploreHub.jsx
          grep -q '2027-03-06' client/src/components/HomeLiveAgenda.jsx
          grep -q 'Iron Maiden' client/src/components/HomeLiveAgenda.jsx
          grep -q 'Os Paralamas do Sucesso' client/src/components/HomeLiveAgenda.jsx
          grep -q 'Scorpions' client/src/components/HomeLiveAgenda.jsx
          grep -q 'Duran Duran' client/src/components/HomeLiveAgenda.jsx
          grep -q 'Deep Purple' client/src/components/HomeLiveAgenda.jsx
          grep -q 'height: 58px' client/src/styles/header-logo-fix.css
          test -f client/src/pages/Guiropa70sTunnelPage.jsx
          test -f client/src/pages/Guiropa80sTunnelPage.jsx
          grep -q '181-70s_128k.mp3' client/src/pages/GuiropaUnifiedRadioPage.jsx
          grep -q '181-awesome80s_128k.mp3' client/src/pages/GuiropaUnifiedRadioPage.jsx
