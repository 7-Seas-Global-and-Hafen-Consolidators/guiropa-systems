name: GUIROPA News Tunnel pt-BR Post-Publish Guard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-world-ptbr-guard.yml"
      - "tools/guiropa_ptbr_postpublish_guard.py"
      - "client/scripts/publish-rss-vault.mjs"
      - "client/public/data/rss-world-feed.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guiropa-news-ptbr-postpublish-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve current sealed baseline
        shell: bash
        run: |
          BASELINE="${RUNNER_TEMP}/guiropa-rss-baseline"
          mkdir -p "$BASELINE"
          cp client/public/data/rss-world-feed.json "$BASELINE/rss-world-feed.json"
          cp client/public/data/rss-world-ledger.json "$BASELINE/rss-world-ledger.json"
          echo "GUIROPA_RSS_BASELINE=$BASELINE" >> "$GITHUB_ENV"

      - name: Audit published pt-BR stories
        run: python tools/guiropa_ptbr_postpublish_guard.py

      - name: Seal public RSS and discard provenance
        run: node client/scripts/publish-rss-vault.mjs

      - name: Verify source repository feed is sanitized
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('client/public/data/rss-world-feed.json')
          d=json.loads(p.read_text('utf-8'))
          forbidden={'source','sourceId','url','title','excerpt','originalLanguage','editorialProvider','editorialModel','editorialGeneratedAt','editorialQualityReset'}
          assert set(d).isdisjoint({'sources','bridge'}), f'RAW top-level metadata leaked: {set(d) & {"sources","bridge"}}'
          for item in d.get('items') or []:
              leaked=forbidden.intersection(item)
              assert not leaked, f'RAW provenance leaked in {item.get("id")}: {sorted(leaked)}'
              assert item.get('editorialStatus') == 'ready'
              assert item.get('titlePt') and item.get('excerptPt')
              assert isinstance(item.get('bodyPt'), list) and len(item['bodyPt']) >= 4
          print(f"GUIROPA vault sealed: {len(d.get('items') or [])} public PT-BR stories")
          PY

      - name: Suppress timestamp-only seal churn
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          baseline=Path(os.environ['GUIROPA_RSS_BASELINE'])
          current_feed=json.loads(Path('client/public/data/rss-world-feed.json').read_text('utf-8'))
          current_ledger=json.loads(Path('client/public/data/rss-world-ledger.json').read_text('utf-8'))
          old_feed=json.loads((baseline/'rss-world-feed.json').read_text('utf-8'))
          old_ledger=json.loads((baseline/'rss-world-ledger.json').read_text('utf-8'))
          strip_time=lambda d:{k:v for k,v in d.items() if k!='updatedAt'}
          same=strip_time(current_feed)==strip_time(old_feed) and strip_time(current_ledger)==strip_time(old_ledger)
          if same:
              Path('client/public/data/rss-world-feed.json').write_text((baseline/'rss-world-feed.json').read_text('utf-8'),'utf-8')
              Path('client/public/data/rss-world-ledger.json').write_text((baseline/'rss-world-ledger.json').read_text('utf-8'),'utf-8')
              print('No semantic RSS change; original timestamps restored.')
          else:
              print('Semantic RSS repair detected.')
          PY

      - name: Verify no direct protected-main mutation is required
        shell: bash
        run: |
          if git diff --quiet -- client/public/data/rss-world-feed.json client/public/data/rss-world-ledger.json; then
            echo "RSS vault already sealed; no protected-main write required."
            exit 0
          fi
          echo "A semantic RSS repair exists and must be published through a pull request under current repository rules."
          git diff -- client/public/data/rss-world-feed.json client/public/data/rss-world-ledger.json
          exit 1
