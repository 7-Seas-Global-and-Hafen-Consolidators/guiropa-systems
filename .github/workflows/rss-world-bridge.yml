name: GUIROPA RSS World Bridge

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rss-world-bridge.yml"
      - "client/scripts/rss-world-bridge.mjs"
      - "client/scripts/publish-rss-vault.mjs"
      - "tools/guiropa_news_editorial.py"
      - "tools/guiropa_news_editorial_source_fallback.py"
      - "tools/guiropa_ptbr_postpublish_guard.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guiropa-rss-world-bridge
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_FREE_API_KEY }}
      GUIROPA_GROQ_MODEL: openai/gpt-oss-120b
      GUIROPA_GEMINI_MODEL: gemini-2.5-flash-lite
      GUIROPA_OPENROUTER_MODEL: openrouter/free
      GUIROPA_LOCAL_BATCH: "2"
      GUIROPA_SOURCE_FALLBACK_BATCH: "100"
      GUIROPA_EDITORIAL_DAILY_LIMIT: "500"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create ephemeral RSS vault
        shell: bash
        run: |
          VAULT="${RUNNER_TEMP}/guiropa-rss-vault"
          mkdir -p "$VAULT/public/data"
          cp client/public/data/rss-world-feed.json "$VAULT/public/data/rss-world-feed.json"
          cp client/public/data/rss-world-ledger.json "$VAULT/public/data/rss-world-ledger.json"
          echo "GUIROPA_RSS_VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "RAW RSS will exist only inside $VAULT during this job."

      - name: Collect RSS world signals inside ephemeral vault
        shell: bash
        run: |
          cd "$GUIROPA_RSS_VAULT"
          node "$GITHUB_WORKSPACE/client/scripts/rss-world-bridge.mjs"
          cp public/data/rss-world-feed.json "$GITHUB_WORKSPACE/client/public/data/rss-world-feed.json"
          echo "Raw ingest moved into runner checkout for in-job editorial processing only."

      - name: Promote grounded Portuguese signals
        run: python tools/guiropa_news_editorial_source_fallback.py

      - name: Build additional Portuguese full stories
        id: multiprovider
        continue-on-error: true
        run: python tools/guiropa_news_editorial.py

      - name: Record provider degradation without exposing RAW
        if: steps.multiprovider.outcome != 'success'
        run: echo "Multiprovider degraded; grounded PT-BR fallback remains active." >> "$GITHUB_STEP_SUMMARY"

      - name: Audit pt-BR before publication
        run: python tools/guiropa_ptbr_postpublish_guard.py

      - name: Seal public feed and published-only ledger
        run: node client/scripts/publish-rss-vault.mjs

      - name: Prove RAW provenance is absent before commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('client/public/data/rss-world-feed.json').read_text('utf-8'))
          forbidden={'source','sourceId','url','title','excerpt','originalLanguage','editorialProvider','editorialModel','editorialGeneratedAt','editorialQualityReset'}
          assert 'sources' not in d and 'bridge' not in d
          for item in d.get('items') or []:
              leaked=forbidden.intersection(item)
              assert not leaked, f'RAW provenance leak: {item.get("id")} {sorted(leaked)}'
              assert item.get('editorialStatus') == 'ready'
              assert item.get('titlePt') and item.get('excerptPt')
              assert isinstance(item.get('bodyPt'), list) and len(item['bodyPt']) >= 4
          ledger=json.loads(Path('client/public/data/rss-world-ledger.json').read_text('utf-8'))
          assert set(ledger.get('ids') or []) == {x['id'] for x in d.get('items') or []}
          print(f"Ephemeral vault sealed: {len(d.get('items') or [])} published PT-BR items")
          PY

      - name: Destroy ephemeral RAW vault
        if: always()
        shell: bash
        run: |
          rm -rf "${GUIROPA_RSS_VAULT:-${RUNNER_TEMP}/guiropa-rss-vault}"
          echo "Ephemeral RAW RSS destroyed."

      - name: Publish sanitized payload through protected-main PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SAFE="${RUNNER_TEMP}/guiropa-rss-publish"
          BRANCH="automation/guiropa-rss-refresh"
          mkdir -p "$SAFE"
          cp client/public/data/rss-world-feed.json "$SAFE/rss-world-feed.json"
          cp client/public/data/rss-world-ledger.json "$SAFE/rss-world-ledger.json"

          git fetch origin main
          git reset --hard origin/main

          python - "$SAFE/rss-world-feed.json" "$SAFE/rss-world-ledger.json" <<'PY'
          import json,sys
          from pathlib import Path
          incoming_feed=json.loads(Path(sys.argv[1]).read_text('utf-8'))
          incoming_ledger=json.loads(Path(sys.argv[2]).read_text('utf-8'))
          current_feed=json.loads(Path('client/public/data/rss-world-feed.json').read_text('utf-8'))
          current_ledger=json.loads(Path('client/public/data/rss-world-ledger.json').read_text('utf-8'))
          def semantic_feed(d):
              return {k:v for k,v in d.items() if k != 'updatedAt'}
          def semantic_ledger(d):
              return {k:v for k,v in d.items() if k != 'updatedAt'}
          same = semantic_feed(incoming_feed) == semantic_feed(current_feed) and semantic_ledger(incoming_ledger) == semantic_ledger(current_ledger)
          Path(sys.argv[1] + '.semantic').write_text('same' if same else 'changed', encoding='utf-8')
          print('RSS semantic payload unchanged' if same else 'RSS semantic payload changed')
          PY

          if [ "$(cat "$SAFE/rss-world-feed.json.semantic")" = "same" ]; then
            echo "No new publishable RSS content. Timestamp-only churn suppressed."
            exit 0
          fi

          cp "$SAFE/rss-world-feed.json" client/public/data/rss-world-feed.json
          cp "$SAFE/rss-world-ledger.json" client/public/data/rss-world-ledger.json

          git config user.name "GUIROPA RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add client/public/data/rss-world-feed.json client/public/data/rss-world-ledger.json
          git commit -m "chore(rss): publish sanitized GUIROPA world feed"
          git push --force origin "HEAD:$BRANCH"

          PR_URL="$(gh pr list --state open --base main --head "$BRANCH" --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          if [ -z "$PR_URL" ]; then
            set +e
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "GUIROPA RSS: publish sanitized world feed" --body "Automated sanitized RSS publication from the ephemeral GUIROPA World Bridge. Public payload contains only complete PT-BR editorial stories and the published-only ledger. RAW provenance stays outside the repository." 2>"$SAFE/pr-create.err")"
            PR_STATUS=$?
            set -e
            if [ "$PR_STATUS" -eq 0 ] && [ -n "$PR_URL" ]; then
              echo "Opened protected-main RSS PR: $PR_URL"
            else
              echo "RSS refresh branch pushed successfully; repository policy blocks GitHub Actions PR creation."
              echo "Branch ready for manual PR: $BRANCH"
              {
                echo "### RSS publication staged"
                echo "Branch \`$BRANCH\` contains the sanitized payload."
                echo "Repository policy prevented the Actions token from opening the pull request automatically; the ingest itself succeeded."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Updated existing protected-main RSS PR: $PR_URL"
          fi

          echo "RSS semantic update staged safely; main was not pushed directly."
