name: GUIROPA News Tunnel Free Multiprovider Editorial

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guiropa-news-portuguese-editorial
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_FREE_API_KEY }}
      GUIROPA_GROQ_MODEL: openai/gpt-oss-120b
      GUIROPA_GEMINI_MODEL: gemini-2.5-flash-lite
      GUIROPA_OPENROUTER_MODEL: openrouter/free

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build up to 12 complete Portuguese Full Stories
        run: python tools/guiropa_news_editorial.py

      - name: Enforce truthful editorial health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('client/public/data/rss-world-feed.json')
          d=json.loads(p.read_text('utf-8'))
          items=d.get('items') or []
          ready=[x for x in items if x.get('editorialStatus') == 'ready']
          unsafe=[x.get('id') for x in ready if not x.get('titlePt') or not x.get('excerptPt') or len(x.get('bodyPt') or []) < 4]
          if unsafe:
              raise SystemExit(f'EDITORIAL BLOCKED — incomplete public stories: {unsafe[:10]}')
          print(f"Editorial health OK: ready={len(ready)} pending={d.get('editorialPending',0)} today={d.get('editorialPublishedToday',0)}/{d.get('editorialDailyLimit',500)}")
          PY

      - name: Commit only complete Portuguese editorial updates
        shell: bash
        run: |
          if git diff --quiet -- client/public/data/rss-world-feed.json; then
            echo "No editorial changes. Nothing to publish."
            exit 0
          fi

          git config user.name "GUIROPA News Editorial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/rss-world-feed.json
          git commit -m "PUBLISH GUIROPA NEWS TUNNEL IN PORTUGUESE"
          git pull --rebase origin main
          git push origin HEAD:main
