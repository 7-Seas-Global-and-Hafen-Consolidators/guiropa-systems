name: GUIROPA News Tunnel Zero-Cost Multiprovider Editorial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify public feed is sealed and Portuguese
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('client/public/data/rss-world-feed.json').read_text('utf-8'))
          forbidden={'source','sourceId','url','title','excerpt','originalLanguage','editorialProvider','editorialModel','editorialGeneratedAt','editorialQualityReset'}
          assert 'sources' not in d and 'bridge' not in d
          for item in d.get('items') or []:
              assert not forbidden.intersection(item)
              assert item.get('editorialStatus') == 'ready'
              assert item.get('titlePt') and item.get('excerptPt')
              assert isinstance(item.get('bodyPt'), list) and len(item['bodyPt']) >= 4
          print(f"Compatibility audit OK: {len(d.get('items') or [])} sealed PT-BR stories")
          PY

      - name: Explain automatic editorial ownership
        run: echo "Automatic ingest + PT-BR editorial now runs inside GUIROPA RSS World Bridge ephemeral vault."
