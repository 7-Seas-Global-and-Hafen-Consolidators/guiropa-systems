name: GUIROPA News Tunnel Editorial — Passport Secret Bridge

on:
  schedule:
    - cron: "12,42 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rss-world-editorial.yml"
      - "tools/guiropa_editorial_bridge_apply.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guiropa-news-portuguese-editorial
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Passport-generated GUIROPA Full Stories
        run: python tools/guiropa_editorial_bridge_apply.py

      - name: Enforce truthful editorial health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('client/public/data/rss-world-feed.json')
          d=json.loads(p.read_text('utf-8'))
          items=d.get('items') or []
          ready=[x for x in items if x.get('editorialStatus') == 'ready']
          unsafe=[x.get('id') for x in ready if not x.get('titlePt') or not x.get('excerptPt') or len(x.get('bodyPt') or []) < 4]
          if unsafe:
              raise SystemExit(f'EDITORIAL BLOCKED — incomplete public stories: {unsafe[:10]}')
          print(f"Editorial health OK: ready={len(ready)} pending={d.get('editorialPending',0)} today={d.get('editorialPublishedToday',0)}/{d.get('editorialDailyLimit',500)}")
          PY

      - name: Commit only complete Portuguese editorial updates
        shell: bash
        run: |
          if git diff --quiet -- client/public/data/rss-world-feed.json; then
            echo "No new bridge stories. Nothing to publish."
            exit 0
          fi

          git config user.name "GUIROPA News Editorial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/rss-world-feed.json
          git commit -m "PUBLISH GUIROPA NEWS TUNNEL IN PORTUGUESE"
          git pull --rebase origin main
          git push origin HEAD:main
