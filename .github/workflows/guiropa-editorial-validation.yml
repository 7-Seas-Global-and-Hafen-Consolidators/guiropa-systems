name: GUIROPA Editorial Architecture Validation

on:
  pull_request:
    paths:
      - '.github/workflows/rss-world-editorial.yml'
      - '.github/workflows/rss-world-bridge.yml'
      - '.github/workflows/rss-world-ptbr-guard.yml'
      - '.github/workflows/guiropa-editorial-validation.yml'
      - 'client/scripts/publish-rss-vault.mjs'
      - 'tools/guiropa_news_editorial.py'
      - 'tools/guiropa_news_editorial_envelope.py'
      - 'tools/guiropa_news_editorial_source_fallback.py'
      - 'tools/guiropa_ptbr_postpublish_guard.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rss-world-editorial.yml'
      - '.github/workflows/rss-world-bridge.yml'
      - '.github/workflows/rss-world-ptbr-guard.yml'
      - '.github/workflows/guiropa-editorial-validation.yml'
      - 'client/scripts/publish-rss-vault.mjs'
      - 'tools/guiropa_news_editorial.py'
      - 'tools/guiropa_news_editorial_envelope.py'
      - 'tools/guiropa_news_editorial_source_fallback.py'
      - 'tools/guiropa_ptbr_postpublish_guard.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile editorial engines
        run: python -m py_compile tools/guiropa_news_editorial.py tools/guiropa_news_editorial_envelope.py tools/guiropa_news_editorial_source_fallback.py tools/guiropa_ptbr_postpublish_guard.py
      - name: Validate ephemeral-vault editorial contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('tools/guiropa_news_editorial.py').read_text('utf-8')
          envelope=Path('tools/guiropa_news_editorial_envelope.py').read_text('utf-8')
          fallback=Path('tools/guiropa_news_editorial_source_fallback.py').read_text('utf-8')
          editorial=Path('.github/workflows/rss-world-editorial.yml').read_text('utf-8')
          bridge=Path('.github/workflows/rss-world-bridge.yml').read_text('utf-8')
          guard=Path('.github/workflows/rss-world-ptbr-guard.yml').read_text('utf-8')
          vault=Path('client/scripts/publish-rss-vault.mjs').read_text('utf-8')

          assert 'BATCH_SIZE = 12' in engine
          assert 'DAILY_LIMIT = 500' in engine
          assert 'groq-free' in engine
          assert 'gemini-free' in engine
          assert 'openrouter-free' in engine
          assert 'validate_story' in engine
          assert 'unsafe editorial word count' in engine

          assert 'GROUNDING_VERSION = "passport-fact-pack-v3"' in envelope
          assert 'validate_grounding' in envelope
          assert 'editorialFactPackSha256' in envelope

          assert 'translationStatus' in fallback
          assert 'pt-ready' in fallback
          assert 'source-structured-pt' in fallback
          assert 'zero-cost-factual-envelope-v3' in fallback
          assert 'titlePt' in fallback and 'excerptPt' in fallback
          assert 'source.casefold() in public_seed' in fallback
          assert 'a partir de {source}' not in fallback
          assert 'A pauta permanece conectada' not in fallback
          assert 'link original' not in fallback.lower()

          assert 'cron: "17,47 * * * *"' in bridge
          assert 'RUNNER_TEMP' in bridge
          assert 'guiropa-rss-vault' in bridge
          assert 'python tools/guiropa_news_editorial_source_fallback.py' in bridge
          assert 'python tools/guiropa_news_editorial.py' in bridge
          assert 'python tools/guiropa_ptbr_postpublish_guard.py' in bridge
          assert 'node client/scripts/publish-rss-vault.mjs' in bridge
          assert 'Destroy ephemeral RAW vault' in bridge
          assert 'workflow_run:' not in bridge

          assert 'schedule:' not in editorial
          assert 'workflow_dispatch:' in editorial
          assert 'contents: read' in editorial

          assert 'publish-rss-vault.mjs' in guard
          assert 'sourceId' in vault and 'originalLanguage' in vault
          assert 'published-only' in vault
          assert 'Install GitHub Copilot CLI' not in bridge
          print('GUIROPA editorial architecture OK: RSS RAW ephemeral + PT-BR fail-closed + sanitized public ledger')
          PY
